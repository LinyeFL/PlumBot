# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven
 
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
 
name: Java CI with Maven
 
on:
  push:
    branches: [ "main", "build-1.3.2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
 
jobs:
  build:
 
    runs-on: ubuntu-latest
 
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
        cache: maven
    - name: Clone and build KookBC
      run: |
        git clone --depth 1 https://github.com/SNWCreations/KookBC.git
        cd KookBC
        chmod +x gradlew
        ./gradlew shadowJar --no-daemon
    - name: Install KookBC to local Maven repo
      run: mvn install:install-file -Dfile=KookBC/build/libs/kookbc-0.33.0-all.jar -DgroupId=io.github.snwcreations -DartifactId=KookBC -Dversion=0.33.0 -Dpackaging=jar
    - name: Build with Maven
      run: mvn -B package --file pom.xml
 
    - name: Upload a Build Artifact - PlumBot-bukkit
      uses: actions/upload-artifact@v4
      with:
        name: "PlumBot-bukkit.jar"
        path: 'plumbot-bukkit/target/plumbot-bukkit-*.jar'
 
    - name: Upload a Build Artifact - PlumBot-velocity
      uses: actions/upload-artifact@v4
      with:
        name: "PlumBot-velocity.jar"
        path: 'plumbot-velocity/target/plumbot-velocity-*.jar'
 
    - name: Upload a Build Artifact - PlumBot-bungee
      uses: actions/upload-artifact@v4
      with:
        name: "Plumbot-bungee.jar"
        path: 'plumbot-bungee/target/plumbot-bungee-*.jar'
